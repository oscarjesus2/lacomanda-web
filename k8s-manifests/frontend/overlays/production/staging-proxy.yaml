apiVersion: v1
kind: ConfigMap
metadata:
  name: staging-proxy-config
data:
  default.conf: |
    map $http_x_forwarded_proto $forwarded_proto {
      default $http_x_forwarded_proto;
      ""      $scheme;
    }

    map $http_upgrade $connection_upgrade {
      default upgrade;
      ""      close;
    }

    # Google Cloud añade al final de X-Forwarded-For la IP real del cliente y
    # la IP pública del balanceador. Se toma la penúltima entrada, ignorando
    # cualquier prefijo enviado por el cliente, para no aceptar una IP falsa.
    map $http_x_forwarded_for $google_load_balancer_client_ip {
      ~^(?:.*,\s*)?([^,\s]+),\s*[^,\s]+$ $1;
      default                              $remote_addr;
    }

    # El proxy es compartido. Solo Matomo recibe la cadena saneada; los demás
    # servicios conservan exactamente el comportamiento anterior.
    map $host $upstream_real_ip {
      matomo.staging.lacomanda.store $google_load_balancer_client_ip;
      matomo.lacomanda.store         $google_load_balancer_client_ip;
      default                        $remote_addr;
    }

    map $host $upstream_forwarded_for {
      matomo.staging.lacomanda.store $google_load_balancer_client_ip;
      matomo.lacomanda.store         $google_load_balancer_client_ip;
      default                        $proxy_add_x_forwarded_for;
    }

    map $host $staging_upstream {
      portal.staging.lacomanda.store portal-lacomanda.frontend-appweb-staging.svc.cluster.local:80;
      auth.staging.lacomanda.store   keycloak.keycloak-staging.svc.cluster.local:8080;
      auth.lacomanda.store           keycloak.keycloak-production.svc.cluster.local:8080;
      auth-staging.tax-flow.store    keycloak.keycloak-staging.svc.cluster.local:8080;
      auth.tax-flow.store            keycloak.keycloak-production.svc.cluster.local:8080;
      sonarqube.lacomanda.store      sonarqube-service.sonarqube.svc.cluster.local:9000;
      matomo.staging.lacomanda.store matomo.matomo-staging.svc.cluster.local:80;
      matomo.lacomanda.store         matomo.matomo-production.svc.cluster.local:80;
      default                        frontend.frontend-appweb-staging.svc.cluster.local:80;
    }

    # Chrome valida esta asociación antes de considerar Keycloak parte del
    # ámbito de la PWA. Se publican las dos representaciones usadas por Chrome:
    # la lista legacy y el diccionario actual indexado por el id del manifest.
    # Cada origen desde el que se instala la PWA debe aparecer de forma exacta;
    # Chrome no admite comodines para web_app_identity.
    map $host $web_app_origin_association {
      default                        '{"web_apps":[]}';
      auth.lacomanda.store           '{"web_apps":[{"web_app_identity":"https://app.lacomanda.store/"},{"web_app_identity":"https://soho-399.lacomanda.store/"}],"https://app.lacomanda.store/":{"scope":"/"},"https://soho-399.lacomanda.store/":{"scope":"/"}}';
      auth.staging.lacomanda.store   '{"web_apps":[{"web_app_identity":"https://app.staging.lacomanda.store/"}],"https://app.staging.lacomanda.store/":{"scope":"/"}}';
    }

    server {
      listen 8080;
      server_name _;

      server_tokens off;
      client_max_body_size 100m;
      resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      location = /.well-known/web-app-origin-association {
        access_log off;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        return 200 $web_app_origin_association;
      }

      location / {
        proxy_pass http://$staging_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $upstream_real_ip;
        proxy_set_header X-Forwarded-For $upstream_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
        proxy_redirect off;
      }
    }
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: staging-proxy-backendconfig
spec:
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 60
  healthCheck:
    type: HTTP
    requestPath: /healthz
    port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: staging-proxy
  labels:
    app: staging-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: staging-proxy
  template:
    metadata:
      labels:
        app: staging-proxy
    spec:
      # El balanceador de Google tarda ~75 s en retirar un endpoint del NEG. Sin
      # esta espera, nginx se para al instante y el LB devuelve 502 durante el
      # rollout. Debe superar al preStop.
      terminationGracePeriodSeconds: 120
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          lifecycle:
            preStop:
              sleep:
                seconds: 90
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits: {}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: staging-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: staging-proxy
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "staging-proxy-backendconfig"}'
spec:
  type: ClusterIP
  selector:
    app: staging-proxy
  ports:
    - name: http
      port: 80
      targetPort: http

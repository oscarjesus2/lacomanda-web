apiVersion: v1
kind: ConfigMap
metadata:
  name: staging-proxy-config
data:
  default.conf: |
    map $http_x_forwarded_proto $forwarded_proto {
      default $http_x_forwarded_proto;
      ""      $scheme;
    }

    map $http_upgrade $connection_upgrade {
      default upgrade;
      ""      close;
    }

    map $host $staging_upstream {
      portal.staging.lacomanda.store portal-lacomanda.frontend-appweb-staging.svc.cluster.local:80;
      api.staging.lacomanda.store    backend-core.backend-core-staging.svc.cluster.local:80;
      auth.staging.lacomanda.store   keycloak.keycloak-staging.svc.cluster.local:8080;
      auth.lacomanda.store           keycloak.keycloak-production.svc.cluster.local:8080;
      sonarqube.lacomanda.store      sonarqube-service.sonarqube.svc.cluster.local:9000;
      default                        frontend.frontend-appweb-staging.svc.cluster.local:80;
    }

    server {
      listen 8080;
      server_name _;

      server_tokens off;
      client_max_body_size 100m;
      resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      location / {
        proxy_pass http://$staging_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
        proxy_redirect off;
      }
    }
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: staging-proxy-backendconfig
spec:
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 60
  healthCheck:
    type: HTTP
    requestPath: /healthz
    port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: staging-proxy
  labels:
    app: staging-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: staging-proxy
  template:
    metadata:
      labels:
        app: staging-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits: {}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: staging-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: staging-proxy
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "staging-proxy-backendconfig"}'
spec:
  type: ClusterIP
  selector:
    app: staging-proxy
  ports:
    - name: http
      port: 80
      targetPort: http

# Certificado comodín (cert-manager + Let's Encrypt DNS-01 vía IONOS) para los
# dominios que administra IONOS. CCAP Code usa un certificado administrado por
# GKE porque su zona DNS se gestiona en Squarespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-lacomanda
spec:
  secretName: wildcard-lacomanda-tls
  issuerRef:
    name: letsencrypt-ionos
    kind: ClusterIssuer
  dnsNames:
    - "lacomanda.store"
    - "*.lacomanda.store"
    - "*.staging.lacomanda.store"
    - "auth.tax-flow.store"
    - "auth-staging.tax-flow.store"
    - "app.tax-flow.store"
    - "app-staging.tax-flow.store"

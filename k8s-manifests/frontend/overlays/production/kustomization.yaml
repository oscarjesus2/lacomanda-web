apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: frontend-appweb-production

resources:
- ../../base
- namespace.yaml
- ingress.yaml
- certificate.yaml
- frontendconfig.yaml
- staging-proxy.yaml
- taxflow-staging-proxy.yaml
- taxflow-production-proxy.yaml

images:
- name: oscar020/frontend
  newName: oscar020/frontend
  newTag: 202609150554-6d94adc-production

# Solo en producción el balanceador de Google apunta directamente a este pod
# (NEG). Tarda ~75 s en retirar un endpoint: sin la espera, el rollout deja
# 502. En staging el tráfico llega por staging-proxy vía ClusterIP.
patches:
- patch: |-
    - op: add
      path: /spec/template/spec/terminationGracePeriodSeconds
      value: 120
    - op: add
      path: /spec/template/spec/containers/0/lifecycle
      value:
        preStop:
          sleep:
            seconds: 90
  target:
    kind: Deployment
    name: frontend

# Certificado comodín (cert-manager + Let's Encrypt DNS-01 vía IONOS) para los
# subdominios de tenant en staging. cert-manager crea el Secret wildcard-lacomanda-tls
# que usa el ingress. Requiere el ClusterIssuer "letsencrypt-ionos" ya instalado
# (ver infra-lacomanda-cluster/k8s-manifests/wildcard/README.md — pasos de cluster).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-lacomanda
spec:
  secretName: wildcard-lacomanda-tls
  issuerRef:
    name: letsencrypt-ionos
    kind: ClusterIssuer
  dnsNames:
    - "*.staging.lacomanda.store"

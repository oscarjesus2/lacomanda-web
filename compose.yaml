services:
  angular:
    image: node:26.5.0
    container_name: lacomanda-angular
    working_dir: /app

    ports:
      - "4200:4200"

    volumes:
      - .:/app
      - lacomanda_node_modules:/app/node_modules

    environment:
          NG_CLI_ANALYTICS: "false"

    command: >-
      sh -c "(command -v python3 >/dev/null || (apt-get update && apt-get install -y --no-install-recommends python3))
      && npm install && npm run caja:paquete && npx ng serve --host 0.0.0.0 --poll 1000"
    
    stdin_open: true
    tty: true

volumes:
  lacomanda_node_modules:

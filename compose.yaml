services:
  angular:
    image: node:26.5.0
    container_name: lacomanda-angular
    working_dir: /app

    ports:
      - "4200:4200"

    volumes:
      - .:/app
      - lacomanda_node_modules:/app/node_modules

    environment:
          NG_CLI_ANALYTICS: "false"

    command: npx ng serve --host 0.0.0.0 --poll 1000
    
    stdin_open: true
    tty: true

volumes:
  lacomanda_node_modules:
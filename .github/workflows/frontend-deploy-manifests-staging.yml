name: Frontend - Build & Deploy to Staging (GKE)

# El despliegue a staging queda supeditado al control de calidad: se dispara
# cuando "SonarQube - Analyze" ha terminado sobre develop y solo continúa si
# concluyó en verde. Ese workflow ejecuta las pruebas unitarias con cobertura
# antes del análisis, de modo que una regresión impide publicar la imagen.
on:
  workflow_run:
    workflows: ["SonarQube - Analyze"]
    branches: [develop]
    types: [completed]
  workflow_dispatch:

jobs:
  build-and-deploy-staging:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    concurrency: frontend-staging-${{ github.ref }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # para poder hacer commit/push
      id-token: write # OIDC → Workload Identity Federation
    env:
      IMAGE_NAME: oscar020/frontend
      PROJECT_ID: lacomanda-477709
      GKE_CLUSTER: gke-eusw1-autopilot-01
      GKE_LOCATION: europe-southwest1
      GSA_EMAIL: gha-gke-deployer@lacomanda-477709.iam.gserviceaccount.com
      WORKLOAD_IDENTITY_PROVIDER: projects/161733769525/locations/global/workloadIdentityPools/github-pool/providers/github-pool

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: develop

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Generate tags
      run: |
        IMAGE_TAG=$(date +%Y%m%d%H%M)-${GITHUB_SHA::7}
        STAGING_TAG=${IMAGE_TAG}-staging
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
        echo "STAGING_TAG=$STAGING_TAG" >> $GITHUB_ENV

    - name: Build and push image with -staging
      run: |
        docker build \
          --build-arg BUILD_CONFIG=staging \
          --build-arg APP_VERSION=$STAGING_TAG \
          -t $IMAGE_NAME:$STAGING_TAG \
          -f ./dockerfiles/frontend/Dockerfile .
        docker push $IMAGE_NAME:$STAGING_TAG

    - name: Install kustomize
      run: |
        KUSTOMIZE_VERSION=v5.4.3
        curl -fsSL \
          "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
          -o kustomize.tar.gz
        tar -xzf kustomize.tar.gz
        sudo mv kustomize /usr/local/bin/
        rm kustomize.tar.gz

    - name: Save latest image tag and update overlay (staging)
      run: |
        echo "$IMAGE_TAG" > latest-frontend-image-tag.txt

        pushd k8s-manifests/frontend/overlays/staging
        kustomize edit set image "$IMAGE_NAME=$IMAGE_NAME:$STAGING_TAG"
        popd

        git fetch origin develop && git checkout develop
        git config user.name  "ci-bot"
        git config user.email "ci@job.pe"
        git add latest-frontend-image-tag.txt k8s-manifests/frontend/overlays/staging/kustomization.yaml
        if ! git diff --cached --quiet; then
          git commit -m "ci(frontend): update staging image → $STAGING_TAG [skip ci]"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push origin develop
        fi

    - name: Auth to Google Cloud (WIF)
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ env.GSA_EMAIL }}

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Get GKE credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ env.GKE_CLUSTER }}
        location: ${{ env.GKE_LOCATION }}
        project_id: ${{ env.PROJECT_ID }}

    - name: Set image tag in overlay (staging)
      run: |
        kustomize edit set image $IMAGE_NAME=$IMAGE_NAME:$STAGING_TAG
      working-directory: k8s-manifests/frontend/overlays/staging

    - name: Commit updated kustomization.yaml
      run: |
        git config --global user.email "ci@job.pe"
        git config --global user.name "ci-bot"
        git pull origin develop
        git add k8s-manifests/frontend/overlays/staging/kustomization.yaml
        if ! git diff --cached --quiet; then
          git commit -m "ci(frontend): update kustomization.yaml with image $STAGING_TAG"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
          git push origin develop
        else
          echo "No hay cambios en kustomization.yaml. Ya estaba actualizado."
        fi

    - name: Verify wildcard certificate infrastructure
      run: |
        if ! kubectl get crd certificates.cert-manager.io >/dev/null 2>&1; then
          echo "::error::Falta cert-manager. Ejecute el workflow de infraestructura 'Infrastructure - Install cert-manager and IONOS DNS'."
          exit 1
        fi

        if ! kubectl get clusterissuer letsencrypt-ionos >/dev/null 2>&1; then
          echo "::error::Falta el ClusterIssuer letsencrypt-ionos. Ejecute primero el workflow de cert-manager en infra-lacomanda-cluster."
          exit 1
        fi

        kubectl wait --for=condition=Ready clusterissuer/letsencrypt-ionos --timeout=2m

    - name: Deploy to staging
      run: |
        kustomize build k8s-manifests/frontend/overlays/staging | kubectl apply -f -
        kubectl wait \
          --namespace frontend-appweb-staging \
          --for=condition=Ready \
          certificate/wildcard-lacomanda \
          --timeout=10m

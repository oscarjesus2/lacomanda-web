<div class="login-container">
  <div class="login-box">
    <!-- Logo + encabezado -->
    <div class="brand">
      <img src="/assets/logo.svg" alt="LaComanda Logo" class="login-logo" />
      <h1 class="title">LaComanda</h1>
      <p class="tagline">{{ 'restaurantManagement' | tenantText }}</p>
      <button *ngIf="showInstallButton" class="pwa-btn" (click)="installPWA()">
        {{ 'installApplication' | tenantText }}
      </button>
    </div>

    <!-- Card del formulario (oculta mientras se decide/redirige, para no
         mostrar el selector por un instante al cerrar sesión) -->
    <div class="login-card" *ngIf="showSelector">

      <!-- ── Vista: Selección de sucursal (paso 1) ───────────────────────── -->
      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <h2 class="step-title">Selecciona tu sucursal</h2>
        <p class="step-subtitle">Elige el local y continúa para iniciar sesión.</p>

        <div *ngIf="!loginValid" class="error-banner">
          {{ 'invalidCredentials' | tenantText }}
        </div>

        <!-- Selector de sucursal -->
        <div class="form-group">
          <label for="tenant">{{ 'branch' | tenantText }}</label>
          <div class="custom-select">
            <select id="tenant" formControlName="tenant" required>
              <option *ngFor="let t of tenantDefault" [ngValue]="t">{{ t.Sucursal }}</option>
            </select>
          </div>
        </div>

        <!-- La contraseña (y "olvidé mi contraseña") se gestionan en la página
             segura de Keycloak, en el siguiente paso. -->

        <button
          type="submit"
          class="login-button"
          [disabled]="isSubmitting || loginForm.invalid">
          <ng-container *ngIf="!isSubmitting; else loadingTpl">
            {{ 'continue' | tenantText }}
          </ng-container>
          <ng-template #loadingTpl>
            <span aria-busy="true">{{ 'signingIn' | tenantText }}</span>
          </ng-template>
        </button>
      </form>

    </div>

    <!-- Versión app -->
    <p class="app-version">
      {{ 'applicationVersion' | tenantText }}: {{ appVersion }}
    </p>
  </div>
</div>

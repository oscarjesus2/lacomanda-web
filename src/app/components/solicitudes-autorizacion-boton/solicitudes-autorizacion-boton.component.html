<ng-container *ngIf="puedeVerCentro$ | async">
  <ng-container *ngIf="{ pendientes: (pendientes$ | async) ?? 0 } as estado">
    <button *ngIf="variante === 'icono'"
            mat-icon-button
            type="button"
            class="approval-button approval-button--icon"
            [class.approval-button--pending]="estado.pendientes > 0"
            [matTooltip]="'notificationCenter' | tenantText"
            [attr.aria-label]="'notificationCenter' | tenantText"
            (click)="abrir()">
      <mat-icon [matBadge]="estado.pendientes"
                [matBadgeHidden]="estado.pendientes === 0"
                matBadgeColor="warn"
                matBadgeSize="small">
        {{ estado.pendientes > 0 ? 'notifications_active' : 'notifications' }}
      </mat-icon>
    </button>

    <button *ngIf="variante === 'canal'"
            type="button"
            class="approval-button approval-button--channel"
            [class.approval-button--pending]="estado.pendientes > 0"
            (click)="abrir()">
      <mat-icon>{{ estado.pendientes > 0 ? 'notifications_active' : 'notifications' }}</mat-icon>
      {{ 'notificationsShort' | tenantText }}
      <span *ngIf="estado.pendientes > 0" class="approval-button__count">{{ estado.pendientes }}</span>
    </button>

    <button *ngIf="variante === 'panel'"
            type="button"
            class="approval-button approval-button--panel"
            [class.approval-button--pending]="estado.pendientes > 0"
            (click)="abrir()">
      <mat-icon>{{ estado.pendientes > 0 ? 'notifications_active' : 'notifications' }}</mat-icon>
      <span>{{ 'notificationsShort' | tenantText }}</span>
      <strong *ngIf="estado.pendientes > 0" class="approval-button__count">{{ estado.pendientes }}</strong>
    </button>
  </ng-container>
</ng-container>

<div class="mant-panel ps-panel">

  <h2>Buscar Producto</h2>

  <!-- Campo de búsqueda -->
  <mat-form-field appearance="fill" class="ps-search-field">
    <mat-label>Buscar por producto</mat-label>
    <mat-icon matPrefix class="ps-search-icon">search</mat-icon>
    <input matInput [(ngModel)]="filterText" (input)="filterProducts()"
           placeholder="Escribe para filtrar…" readonly />
  </mat-form-field>

  <!-- Tabla de resultados -->
  <div class="ps-table-wrap">
    <table mat-table [dataSource]="filteredProducts" class="ps-table">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Producto</th>
        <td mat-cell *matCellDef="let product">{{ product.NombreCorto }}</td>
      </ng-container>

      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>Precio</th>
        <td mat-cell *matCellDef="let product">{{ product.Precio }}</td>
      </ng-container>

      <ng-container matColumnDef="family">
        <th mat-header-cell *matHeaderCellDef>Familia</th>
        <td mat-cell *matCellDef="let product">{{ product.Familia }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"
          [class.ps-row--selected]="selectedProduct === row"
          (click)="selectProduct(row)">
      </tr>
    </table>
  </div>

  <!-- Teclado táctil -->
  <div class="ps-keypad">
    <div *ngFor="let row of keyRows">
      <button *ngFor="let key of row" class="ps-key" (click)="onKeyClick(key)">{{ key }}</button>
    </div>
  </div>

  <!-- Acciones -->
  <div class="ps-actions">
    <button class="ps-btn ps-btn--cancel" (click)="onCancelClick()">Cerrar</button>
    <button class="ps-btn ps-btn--accept" (click)="onAcceptClick()">
      <mat-icon>check</mat-icon> Aceptar
    </button>
  </div>

</div>

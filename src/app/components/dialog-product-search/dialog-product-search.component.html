<div class="mant-panel ps-panel">

  <h2>{{ 'searchProducts' | tenantText }}</h2>

  <!-- Campo de búsqueda -->
  <mat-form-field appearance="fill" class="ps-search-field">
    <mat-label>{{ 'searchByProduct' | tenantText }}</mat-label>
    <mat-icon matPrefix class="ps-search-icon">search</mat-icon>
    <input #campo matInput [(ngModel)]="filterText" (input)="filterProducts()"
           [placeholder]="'typeToFilter' | tenantText"
           autocomplete="off" />
  </mat-form-field>

  <!-- Tabla de resultados -->
  <div class="ps-table-wrap">
    <table mat-table [dataSource]="filteredProducts" class="ps-table">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>{{ 'product' | tenantText }}</th>
        <td mat-cell *matCellDef="let product">{{ product.NombreCorto }}</td>
      </ng-container>

      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>{{ 'price' | tenantText }}</th>
        <td mat-cell *matCellDef="let product">{{ product.Precio }}</td>
      </ng-container>

      <ng-container matColumnDef="family">
        <th mat-header-cell *matHeaderCellDef>{{ 'family' | tenantText }}</th>
        <td mat-cell *matCellDef="let product">{{ product.Familia }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"
          [class.ps-row--selected]="selectedProduct === row"
          (click)="selectProduct(row)">
      </tr>
    </table>
  </div>

  <!-- Teclado en pantalla: solo si la persona lo pide -->
  <app-teclado-tactil
    class="ps-keypad"
    [destino]="campo"
    [campo]="'searchByProduct' | tenantText">
  </app-teclado-tactil>

  <!-- Acciones -->
  <div class="ps-actions">
    <button class="ps-btn ps-btn--cancel" (click)="onCancelClick()">{{ 'close' | tenantText }}</button>
    <button class="ps-btn ps-btn--accept" (click)="onAcceptClick()">
      <mat-icon>check</mat-icon> {{ 'accept' | tenantText }}
    </button>
  </div>

</div>

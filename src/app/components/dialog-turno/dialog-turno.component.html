<div class="mant-panel dialog-panel dialog-panel--compact">
  <button
    mat-icon-button
    class="close-button"
    type="button"
    aria-label="Cerrar diálogo"
    (click)="salir()"
    [disabled]="procesando">
    <mat-icon>close</mat-icon>
  </button>

  <h2>Aperturar turno</h2>

  <div
    class="dialog-notice dialog-notice--success"
    role="status"
    aria-live="polite"
    *ngIf="turnoAbierto">
    <mat-icon>check_circle</mat-icon>
    <div class="dialog-notice__content">
      <span class="dialog-notice__title">Turno {{ nroTurnoAbierto }} abierto</span>
      <span class="dialog-notice__text">
        La caja seleccionada ya está operativa. No es necesario volver a aperturarla.
      </span>
    </div>
  </div>

  <form class="dialog-form" [formGroup]="myForm" novalidate>

    <div class="form-row">
      <mat-form-field class="form-field" appearance="fill">
        <mat-label>Caja</mat-label>
        <mat-select
          [formControl]="myForm.get('caja')"
          (selectionChange)="onCajaSeleccionada($event.value)"
          [disabled]="procesando">
          <mat-option
            *ngFor="let item of listCaja"
            [value]="item.IdCaja">
            {{ item.Descripcion }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="myForm.get('caja')?.hasError('required')">
          Seleccione una caja.
        </mat-error>
      </mat-form-field>

      <mat-form-field class="form-field" appearance="fill">
        <mat-label>Tipo de cambio</mat-label>
        <input
          matInput
          type="number"
          inputmode="decimal"
          min="0.0001"
          step="0.0001"
          [formControl]="myForm.get('tipocambio')" />
        <mat-error *ngIf="myForm.get('tipocambio')?.hasError('required')">
          Ingrese el tipo de cambio.
        </mat-error>
        <mat-error
          *ngIf="myForm.get('tipocambio')?.hasError('min')
            || myForm.get('tipocambio')?.hasError('pattern')">
          Ingrese un valor mayor que cero.
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field class="form-field" appearance="fill">
        <mat-label>Fecha de trabajo</mat-label>
        <input
          matInput
          readonly
          [value]="myForm.get('fecha')?.value | date: 'dd/MM/yyyy HH:mm'" />
      </mat-form-field>
    </div>

    <div class="dialog-actions">
      <button
        *ngIf="!turnoAbierto"
        mat-raised-button
        color="primary"
        type="button"
        (click)="abrirTurno()"
        [disabled]="myForm.invalid || procesando">
        <mat-icon>lock_open</mat-icon>
        <span>Aperturar</span>
      </button>

      <button
        mat-stroked-button
        type="button"
        (click)="salir()"
        [disabled]="procesando">
        <mat-icon>exit_to_app</mat-icon>
        <span>Salir</span>
      </button>
    </div>
  </form>
</div>

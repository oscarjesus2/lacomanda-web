<div class="mant-panel turno-panel">
  <!-- CERRAR -->
  <button mat-icon-button class="close-button" (click)="salir()">
    <mat-icon>close</mat-icon>
  </button>

  <h2 class="turno-panel__title" *ngIf="TurnoAbierto">
    TURNO APERTURADO {{ NroTurnoAbierto }}
  </h2>
  <h2 class="turno-panel__title" *ngIf="!TurnoAbierto">
    APERTURAR TURNO
  </h2>

  <form class="turno-panel__form" [formGroup]="myForm" novalidate>

    <!-- FILA 1: Caja / Tipo de cambio -->
    <div class="form-row">
      <mat-form-field class="form-field" appearance="fill">
        <mat-label>Caja</mat-label>
        <mat-select [formControl]="myForm.get('caja')">
          <mat-option
            *ngFor="let item of listCaja"
            [value]="item.IdCaja"
            (click)="ValidarTurnoAbierto(item)">
            {{ item.Descripcion }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="myForm.get('caja')?.hasError('required')">
          Caja es requerida
        </mat-error>
      </mat-form-field>

      <mat-form-field class="form-field" appearance="fill">
        <mat-label>Tipo de Cambio</mat-label>
        <input matInput [formControl]="myForm.get('tipocambio')" />
        <mat-error *ngIf="myForm.get('tipocambio')?.hasError('required')">
          Tipo de cambio es requerido
        </mat-error>
        <mat-error *ngIf="myForm.get('tipocambio')?.hasError('pattern')">
          Por favor ingrese un tipo de cambio válido.
        </mat-error>
        <mat-error *ngIf="myForm.get('tipocambio')?.hasError('maxlength')">
          Máximo 5 caracteres.
        </mat-error>
      </mat-form-field>
    </div>

    <!-- FILA 2: Fecha trabajo -->
    <div class="form-row">
      <mat-form-field class="form-field" appearance="fill">
        <mat-label>Fecha Trabajo</mat-label>
        <input
          matInput
          [readonly]="true"
          [value]="myForm.get('fecha')?.value | date: 'yyyy-MM-dd HH:mm:ss'"
        />
      </mat-form-field>
    </div>

    <!-- ACCIONES -->
    <div class="turno-panel__actions">
      <button
        mat-raised-button
        color="primary"
        type="button"
        (click)="saveData()"
        [disabled]="myForm.invalid"
      >
        <mat-icon>lock_open</mat-icon>
        <span>Aperturar</span>
      </button>

      <button
        mat-stroked-button
        type="button"
        (click)="salir()"
      >
        <mat-icon>exit_to_app</mat-icon>
        <span>Salir</span>
      </button>
    </div>
  </form>
</div>

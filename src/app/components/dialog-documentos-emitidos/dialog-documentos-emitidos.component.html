<div class="mant-panel dv-panel">

  <!-- Botón cerrar (estilo mant-panel) -->
  <button mat-icon-button class="close-button" (click)="salir()">
    <mat-icon>close</mat-icon>
  </button>

  <h2>Documentos de Ventas</h2>

  <!-- ── Fila 1: Tipos de documento (dinámico por país) ──────────────── -->
  <div class="dv-toolbar">
    <!-- Botones dinámicos desde backend -->
    <button *ngFor="let tipo of tiposDocumento"
            class="dv-filter-btn"
            [class.dv-filter-btn--active]="filterTipoId === tipo.IdTipoDocumento.toString()"
            (click)="selectTipoDoc(tipo)">
      {{ tipo.Descripcion }}
    </button>

    <button class="dv-filter-btn"
            [class.dv-filter-btn--active]="filterTipoId === ''"
            (click)="selectTipoDoc(null)">
      Todos
    </button>

    <div class="dv-toolbar__spacer"></div>

    <button class="dv-filter-btn dv-filter-btn--credito"
            [class.dv-filter-btn--active]="filterTipoId === 'credito'"
            (click)="selectCredito()">
      Al Crédito
    </button>
  </div>

  <!-- ── Fila 2: Monedas (dinámico) + métodos de pago + búsqueda ──── -->
  <div class="dv-toolbar dv-toolbar--secondary">

    <!-- Monedas dinámicas por país -->
    <button *ngFor="let m of monedas"
            class="dv-filter-btn dv-filter-btn--sm"
            [class.dv-filter-btn--active]="filterFormaPago === m.Descripcion"
            (click)="selectFormaPago(m.Descripcion)"
            [title]="m.CodigoISO">
      {{ m.Simbolo }} {{ m.Descripcion }}
    </button>

    <!-- Métodos de pago estáticos -->
    <button class="dv-filter-btn dv-filter-btn--sm"
            [class.dv-filter-btn--active]="filterFormaPago === 'Tarjeta'"
            (click)="selectFormaPago('Tarjeta')">
      <mat-icon style="font-size:14px;width:14px;height:14px;line-height:14px;vertical-align:middle">credit_card</mat-icon>
      Tarjeta
    </button>
    <button class="dv-filter-btn dv-filter-btn--sm"
            [class.dv-filter-btn--active]="filterFormaPago === 'Mixto'"
            (click)="selectFormaPago('Mixto')">Mixto</button>

    <!-- Todos -->
    <button class="dv-filter-btn dv-filter-btn--sm"
            [class.dv-filter-btn--active]="filterFormaPago === ''"
            (click)="selectFormaPago('todos')">Todos</button>

    <div class="dv-toolbar__spacer"></div>

    <input type="text" placeholder="N° Documento" class="dv-search-input"
           [(ngModel)]="nroDocumento" (keyup)="onNroDocumentoChange()" />
  </div>

  <!-- ── Contenido: tabla + acciones laterales ───────────────────────── -->
  <div class="dv-content">

    <!-- Tabla -->
    <div class="dv-table-wrap">
      <mat-table [dataSource]="dataSource" class="dv-table">

        <ng-container matColumnDef="tipo">
          <mat-header-cell *matHeaderCellDef>Tipo</mat-header-cell>
          <mat-cell *matCellDef="let e">{{ e.Tipo }}</mat-cell>
        </ng-container>

        <ng-container matColumnDef="serie">
          <mat-header-cell *matHeaderCellDef>Serie</mat-header-cell>
          <mat-cell *matCellDef="let e">{{ e.Serie }}</mat-cell>
        </ng-container>

        <ng-container matColumnDef="numDoc">
          <mat-header-cell *matHeaderCellDef>N° Doc</mat-header-cell>
          <mat-cell *matCellDef="let e">{{ e.NroDoc }}</mat-cell>
        </ng-container>

        <ng-container matColumnDef="fecha">
          <mat-header-cell *matHeaderCellDef>Fecha</mat-header-cell>
          <mat-cell *matCellDef="let e">{{ e.Fecha | date:'dd/MM/yyyy' }}</mat-cell>
        </ng-container>

        <ng-container matColumnDef="monto">
          <mat-header-cell *matHeaderCellDef>Monto</mat-header-cell>
          <mat-cell *matCellDef="let e">{{ e.Monto | number:'1.2-2' }}</mat-cell>
        </ng-container>

        <ng-container matColumnDef="cliente">
          <mat-header-cell *matHeaderCellDef>Cliente</mat-header-cell>
          <mat-cell *matCellDef="let e">{{ e.Cliente }}</mat-cell>
        </ng-container>

        <ng-container matColumnDef="numeroDoi">
          <mat-header-cell *matHeaderCellDef>N° DOI</mat-header-cell>
          <mat-cell *matCellDef="let e">{{ e.NumeroDoi }}</mat-cell>
        </ng-container>

        <ng-container matColumnDef="forr">
          <mat-header-cell *matHeaderCellDef>F. Pago</mat-header-cell>
          <mat-cell *matCellDef="let e">{{ e.FormaPago }}</mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns;"
                 (click)="selectRow(row)"
                 [class.dv-row--selected]="selectedRow === row">
        </mat-row>
      </mat-table>
    </div>

    <!-- Acciones laterales -->
    <div class="dv-actions">
      <button class="dv-action-btn">
        <mat-icon>picture_as_pdf</mat-icon>
        PDF y XML
      </button>
      <button class="dv-action-btn" (click)="reImprimirDocumento()">
        <mat-icon>print</mat-icon>
        Reimprimir
      </button>
      <button class="dv-action-btn">
        <mat-icon>payment</mat-icon>
        Modificar Pago
      </button>
      <button class="dv-action-btn">
        <mat-icon>edit_document</mat-icon>
        Modificar Doc.
      </button>
      <button class="dv-action-btn dv-action-btn--danger" (click)="anularDocumento()">
        <mat-icon>cancel</mat-icon>
        Anular
      </button>
    </div>

  </div>

  <!-- ── Motivo de anulación ──────────────────────────────────────────── -->
  <div class="dv-motivo">
    <input type="text" class="dv-motivo__input"
           placeholder="Motivo de anulación (requerido para anular)"
           [(ngModel)]="motivoAnulacion" />
    <button class="dv-motivo__kbd-btn" (click)="abrirTeclado()" title="Teclado virtual">
      <mat-icon>keyboard</mat-icon>
    </button>
  </div>

</div>

<div class="mant-panel pos-panel">
  <!-- CERRAR -->
  <button mat-icon-button class="close-button" (click)="cancel()">
    <mat-icon>close</mat-icon>
  </button>

  <h3 class="pos-panel__title">Seleccionar posición</h3>

  <div class="pos-panel__legend">
    <span class="pos-badge pos-badge--free"></span> Libre
    <span class="pos-badge pos-badge--taken"></span> Ocupada
    <span class="pos-badge pos-badge--selected"></span> Elegida
  </div>

  <div
    class="pos-grid"
    [style.gridTemplateColumns]="'repeat(' + data.cols + ', auto)'"
  >
    <button
      *ngFor="let n of grid"
      mat-button
      class="pos-cell"
      [class.pos-cell--taken]="isTaken(n)"
      [class.pos-cell--selected]="selected === n"
      (click)="pick(n)"
      [disabled]="isTaken(n)"
      [matTooltip]="'Posición ' + n"
    >
      {{ n }}
    </button>
  </div>

  <div class="pos-panel__actions">
    <button
      mat-raised-button
      color="primary"
      (click)="confirm()"
      [disabled]="!selected"
    >
      Aceptar
    </button>
    <button mat-stroked-button (click)="cancel()">
      Cancelar
    </button>
  </div>
</div>

<div class="mant-panel pos-panel">
  <!-- CERRAR -->
  <button mat-icon-button class="close-button" [attr.aria-label]="'closeDialog' | tenantText" (click)="cancel()">
    <mat-icon>close</mat-icon>
  </button>

  <h3 class="pos-panel__title">{{ 'selectPositionTitle' | tenantText }}</h3>

  <div class="pos-panel__legend">
    <span class="pos-badge pos-badge--free"></span> {{ 'free' | tenantText }}
    <span class="pos-badge pos-badge--taken"></span> {{ 'occupied' | tenantText }}
    <span class="pos-badge pos-badge--selected"></span> {{ 'selected' | tenantText }}
  </div>

  <div
    class="pos-grid"
    [style.gridTemplateColumns]="'repeat(' + data.cols + ', auto)'"
  >
    <button
      *ngFor="let n of grid"
      mat-button
      class="pos-cell"
      [class.pos-cell--taken]="isTaken(n)"
      [class.pos-cell--selected]="selected === n"
      (click)="pick(n)"
      [disabled]="isTaken(n)"
      [matTooltip]="('position' | tenantText) + ' ' + n"
    >
      {{ n }}
    </button>
  </div>

  <div class="pos-panel__actions">
    <button
      mat-raised-button
      color="primary"
      (click)="confirm()"
      [disabled]="!selected"
    >
      {{ 'accept' | tenantText }}
    </button>
    <button mat-stroked-button (click)="cancel()">
      {{ 'cancel' | tenantText }}
    </button>
  </div>
</div>

<div class="mant-panel mt-panel">

  <button mat-icon-button class="close-button" (click)="cancel()">
    <mat-icon>close</mat-icon>
  </button>

  <h2 *ngIf="title">{{ title }}</h2>

  <div class="mt-display">
    <input
      #campo
      type="text"
      autocomplete="off"
      spellcheck="false"
      [attr.maxlength]="maxLength > 0 ? maxLength : null"
      [(ngModel)]="inputValue"
      (keydown.enter)="accept()"
      placeholder="..." />
  </div>

  <div class="mt-actions">
    <app-teclado-tactil [destino]="campo" (enviar)="accept()"></app-teclado-tactil>

    <button class="mt-btn mt-btn--warn" (click)="clear()">
      <mat-icon>backspace</mat-icon> {{ 'keyboardClear' | tenantText }}
    </button>
    <button class="mt-btn mt-btn--primary" (click)="accept()">
      <mat-icon>check</mat-icon> {{ 'accept' | tenantText }}
    </button>
    <button class="mt-btn mt-btn--secondary" (click)="cancel()">
      {{ 'exit' | tenantText }}
    </button>
  </div>

</div>

<div class="mant-panel mc-panel">

  <button mat-icon-button class="close-button" (click)="cancel()">
    <mat-icon>close</mat-icon>
  </button>

  <h2 *ngIf="title">{{ title }}</h2>

  <input
    class="mc-display"
    [type]="isPassword ? 'password' : 'text'"
    inputmode="none"
    autocomplete="off"
    autocapitalize="off"
    spellcheck="false"
    [(ngModel)]="inputValue"
    placeholder="0" />

  <app-teclado-tactil
    modo="numerico"
    [decimales]="decimales"
    [(valor)]="inputValue"
    (vistaChange)="onVistaTeclado($event)"
    (aceptar)="accept()">
  </app-teclado-tactil>

  <div class="mc-actions">
    <button class="mc-btn mc-btn--warn" (click)="clear()">
      <mat-icon>backspace</mat-icon> {{ 'keyboardClear' | tenantText }}
    </button>
    <button class="mc-btn mc-btn--primary" (click)="accept()">
      <mat-icon>check</mat-icon> {{ 'accept' | tenantText }}
    </button>
    <button class="mc-btn mc-btn--secondary" (click)="cancel()">
      {{ 'exit' | tenantText }}
    </button>
  </div>

</div>

<div class="mant-panel complementos-panel">

  <!-- Botón cerrar (patrón mant-panel) -->
  <button mat-icon-button class="close-button" (click)="cancelar()">
    <mat-icon>close</mat-icon>
  </button>

  <h2>Complementos</h2>

  <div class="columnas">

    <!-- Columna izquierda: botones de complementos configurados -->
    <div class="complementos-configurados">
      <p class="col-header">Seleccionar complemento</p>
      <div class="grid-buttons">
        <button *ngFor="let btn of listProductosComplementos"
                mat-button
                (click)="selectButton(btn)">
          {{ btn.NombreCorto }} x{{ btn.FactorComplemento }}
        </button>
      </div>
    </div>

    <!-- Columna derecha: datos del producto y selección -->
    <div class="producto-info">

      <!-- Nombre del producto -->
      <div class="producto-linea">
        <label>Producto</label>
        <span class="producto-nombre">{{ pedidodet.Producto.NombreCorto }}</span>
      </div>

      <!-- Qty + Cant. Complementos -->
      <div class="producto-cantidad-linea">
        <div class="qty-container">
          <label>Qty</label>
          <input matInput [(ngModel)]="pedidodet.Cantidad" />
          <button mat-icon-button
                  color="primary"
                  (click)="openDialogCant()"
                  [disabled]="pedidodet.Item > 0">
            <mat-icon>add</mat-icon>
          </button>
        </div>
        <div class="complementos1-container">
          <label>Cant. Complem.</label>
          <input matInput [(ngModel)]="cantidadComplementos" readonly />
        </div>
      </div>

      <!-- Tabla de complementos seleccionados -->
      <div class="limited-height-table">
        <mat-table [dataSource]="gridListaPedidoComplemento" class="mat-elevation-z8">

          <ng-container matColumnDef="nombre">
            <mat-header-cell *matHeaderCellDef class="ancho-producto">Producto</mat-header-cell>
            <mat-cell *matCellDef="let element" class="ancho-producto">
              {{ element.ProductoComplemento.NombreCorto }}
            </mat-cell>
          </ng-container>

          <ng-container matColumnDef="qty">
            <mat-header-cell *matHeaderCellDef>Qty</mat-header-cell>
            <mat-cell *matCellDef="let element">{{ element.Cantidad }}</mat-cell>
          </ng-container>

          <ng-container matColumnDef="ft">
            <mat-header-cell *matHeaderCellDef>Ft</mat-header-cell>
            <mat-cell *matCellDef="let element">
              {{ element.ProductoComplemento.FactorComplemento }}
            </mat-cell>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let element">
              <button mat-icon-button
                      color="primary"
                      matTooltip="Más opciones"
                      [matMenuTriggerFor]="MasOpciones">
                <mat-icon>more_horiz</mat-icon>
              </button>
              <mat-menu #MasOpciones="matMenu">
                <button mat-menu-item
                        (click)="aumentarProductGrid(element)"
                        [disabled]="element.ItemComple > 0">
                  <mat-icon>add</mat-icon> Aumentar
                </button>
                <button mat-menu-item
                        (click)="restarProductGrid(element)"
                        [disabled]="element.ItemComple > 0">
                  <mat-icon>remove</mat-icon> Restar
                </button>
                <button mat-menu-item (click)="deleteProductGrid(element)">
                  <mat-icon color="warn">delete</mat-icon> Eliminar
                </button>
              </mat-menu>
            </td>
          </ng-container>

          <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
          <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
      </div>

      <!-- Indicadores de totales -->
      <div class="total-complementos">
        <div class="total-card"
             [ngClass]="{
               'total-card--ok':   total > 0 && totIngreso <= total,
               'total-card--over': total > 0 && totIngreso > total
             }">
          <span class="total-card__label">Ingresados</span>
          <span class="total-card__value">{{ totIngreso }}</span>
        </div>
        <div class="total-card total-card--neutral">
          <span class="total-card__label">Límite</span>
          <span class="total-card__value">{{ total }}</span>
        </div>
      </div>

      <!-- Botones de acción -->
      <div class="botones-accion">
        <button class="aceptar" (click)="aceptar()">Aceptar</button>
        <button class="cancelar" (click)="cancelar()">Cancelar</button>
      </div>

    </div>
  </div>
</div>

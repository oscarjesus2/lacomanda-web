<div class="mant-panel">
  <button mat-icon-button class="close-button" [attr.aria-label]="'closeDialog' | tenantText" (click)="salir()">
    <mat-icon>close</mat-icon>
  </button>

  <h2>{{ 'maintenanceColors' | tenantText }}</h2>

  <!-- LISTA -->
  <div *ngIf="!showForm">
    <button mat-raised-button color="primary" (click)="nuevo()">{{ 'newColor' | tenantText }}</button>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>{{ 'search' | tenantText }}</mat-label>
      <input matInput [(ngModel)]="filtro" (ngModelChange)="applyFilter()" [placeholder]="'descriptionOrRgb' | tenantText">
    </mat-form-field>
 <div class="mant-table-card">
    <mat-table [dataSource]="filtered" class="mat-elevation-z8">
      <ng-container matColumnDef="preview">
        <mat-header-cell *matHeaderCellDef> {{ 'color' | tenantText }} </mat-header-cell>
        <mat-cell *matCellDef="let r">
          <span class="chip" [ngStyle]="swatchStyle(r)"></span>
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="descripcion">
        <mat-header-cell *matHeaderCellDef> {{ 'description' | tenantText }} </mat-header-cell>
        <mat-cell *matCellDef="let r">{{ r.Descripcion }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="rgb">
        <mat-header-cell *matHeaderCellDef> RGB </mat-header-cell>
        <mat-cell *matCellDef="let r">{{ r.Rgb1 }}, {{ r.Rgb2 }}, {{ r.Rgb3 }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="actions">
        <mat-header-cell *matHeaderCellDef> {{ 'actions' | tenantText }} </mat-header-cell>
        <mat-cell *matCellDef="let r">
          <button mat-icon-button color="primary" (click)="onEdit(r)"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button color="warn" (click)="onDelete(r.IdColor)"><mat-icon>delete</mat-icon></button>
        </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
    <mat-paginator [length]="colores.length" [pageSize]="5" [pageSizeOptions]="[5,10,20,50]"></mat-paginator>
  </div></div>

  <!-- FORM -->
  <form *ngIf="showForm" #form="ngForm" (ngSubmit)="onSubmit()">
    <div class="palette-row">
      <div class="preview" [ngStyle]="previewStyle()"></div>
      <div class="picker">
        <label>{{ 'chooseColor' | tenantText }}</label>
        <input type="color" [(ngModel)]="hex" name="hex" (change)="onHexChange()">
      </div>
    </div>

    <div class="swatches">
      <button type="button" class="swatch"
              *ngFor="let h of presetPalette"
              [style.background-color]="h"
              (click)="selectHex(h)">
      </button>
    </div>

    <div class="form-row">
      <mat-form-field class="form-field" appearance="fill">
        <mat-label>{{ 'description' | tenantText }}</mat-label>
        <input matInput [(ngModel)]="c.Descripcion" name="descripcion" required #descripcion="ngModel">
        <mat-error *ngIf="descripcion.invalid && (descripcion.dirty || descripcion.touched)">{{ 'required' | tenantText }}</mat-error>
      </mat-form-field>

      <mat-form-field class="form-field" appearance="fill">
        <mat-label>R</mat-label>
        <input matInput type="number" min="0" max="255" [(ngModel)]="c.Rgb1" (input)="onRgbManualChange()" name="r" required>
      </mat-form-field>

      <mat-form-field class="form-field" appearance="fill">
        <mat-label>G</mat-label>
        <input matInput type="number" min="0" max="255" [(ngModel)]="c.Rgb2" (input)="onRgbManualChange()" name="g" required>
      </mat-form-field>

      <mat-form-field class="form-field" appearance="fill">
        <mat-label>B</mat-label>
        <input matInput type="number" min="0" max="255" [(ngModel)]="c.Rgb3" (input)="onRgbManualChange()" name="b" required>
      </mat-form-field>
    </div>

    <button mat-raised-button color="primary">{{ (c.IdColor ? 'updateAction' : 'save') | tenantText }}</button>
    <button mat-stroked-button type="button" (click)="cancelar()">{{ 'cancel' | tenantText }}</button>
  </form>
</div>

<div class="mant-panel docs-panel">
  <!-- CERRAR -->
  <button mat-icon-button class="close-button" (click)="cerrar()">
    <mat-icon>close</mat-icon>
  </button>

  <h2 class="docs-panel__title">
    Documentos por Caja: {{ nombreCaja }}
  </h2>

  <div *ngIf="loading" class="docs-panel__loading">
    Cargando...
  </div>

  <div *ngIf="!loading" class="docs-panel__body">
    <div class="docs-panel__toolbar">
      <button mat-button class="docs-panel__toolbar-btn" (click)="toggleAll(true)">
        Activar todos
      </button>
      <button mat-button class="docs-panel__toolbar-btn" (click)="toggleAll(false)">
        Desactivar todos
      </button>
    </div>

    <div class="docs-panel__table-wrap">
      <table class="docs-table">
        <thead>
          <tr>
            <th>Activo</th>
            <th>Documento</th>
            <th>Serie</th>
            <th># Actual</th>
            <th>Copias</th>
            <th>Items x Doc</th>
            <th>Preguntar al imprimir</th>
            <th>Mascara</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of rows">
            <td class="docs-table__cell--center">
              <mat-checkbox
                class="docs-checkbox"
                [(ngModel)]="r.Activo">
              </mat-checkbox>
            </td>

            <td>{{ r.Descripcion }}</td>

            <td>
              <input
                matInput
                class="docs-input"
                [(ngModel)]="r.Serie"
                maxlength="4" />
            </td>

            <td>
              <input
                matInput
                class="docs-input docs-input--number"
                type="number"
                [(ngModel)]="r.NumeroActual"
                min="0" />
            </td>

            <td>
              <input
                matInput
                class="docs-input docs-input--number"
                type="number"
                [(ngModel)]="r.CopiasImpresion"
                min="1" />
            </td>

            <td>
              <input
                matInput
                class="docs-input docs-input--number"
                type="number"
                [(ngModel)]="r.ItemsPorDocumento"
                min="0" />
            </td>

            <td class="docs-table__cell--center">
              <mat-checkbox
                class="docs-checkbox"
                [(ngModel)]="r.PreguntarParaImprimir">
              </mat-checkbox>
            </td>

            <td>{{ r.Mascara }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="docs-panel__actions">
    <button mat-raised-button color="primary" (click)="guardar()">
      Guardar
    </button>
    <button mat-stroked-button (click)="cerrar()">
      Cerrar
    </button>
  </div>
</div>

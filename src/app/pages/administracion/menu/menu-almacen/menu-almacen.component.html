<div class="admin-menu">

  <ng-container *ngFor="let section of almacenMenu">

    <!-- Sección con ítems -->
    <div class="admin-menu__section" *ngIf="section.children.length > 0">
      <h4 class="admin-menu__subtitle">{{ section.titleKey | tenantText }}</h4>
      <div class="tiles-grid">
        <button
          type="button"
          class="tile"
          [class.tile--disabled]="item.disabled"
          *ngFor="let item of section.children"
          [disabled]="item.disabled"
          (click)="openDialog(item)"
          [title]="item.titleKey | tenantText"
        >
          <mat-icon class="tile__icon">{{ item.icon }}</mat-icon>
          <span class="tile__label">{{ item.labelKey | tenantText }}</span>
        </button>
      </div>
    </div>

    <!-- Sección sin ítems → tile deshabilitado (próximamente) -->
    <div class="tile tile--disabled" *ngIf="section.children.length === 0" [title]="section.titleKey | tenantText">
      <mat-icon class="tile__icon">{{ section.icon }}</mat-icon>
      <span class="tile__label">{{ section.labelKey | tenantText }}</span>
    </div>

  </ng-container>

</div>

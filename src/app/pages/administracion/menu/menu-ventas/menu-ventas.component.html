<div class="admin-menu">
  <div class="admin-menu__sections">

    <div class="admin-menu__section" *ngFor="let section of seccionesVisibles">
      <h4 class="admin-menu__subtitle">{{ section.titleKey | tenantText }}</h4>

      <ng-container *ngIf="section.title === 'Reportes'; else opcionesSinAgrupar">
        <ng-container *ngFor="let grupo of gruposReportes">
        <div class="admin-menu__subsection"
             *ngIf="reportesVisibles(section, grupo.clave).length > 0"
             [class.admin-menu__subsection--thermal]="grupo.clave === 'turno'">
          <div class="admin-menu__subsection-heading">
            <div>
              <h5 class="admin-menu__subsection-title">{{ grupo.titulo }}</h5>
              <p class="admin-menu__subsection-description">{{ grupo.descripcion }}</p>
            </div>
            <span class="admin-menu__format-badge" *ngIf="grupo.clave === 'turno'">
              <mat-icon>print</mat-icon>
              Ticket 80 mm
            </span>
          </div>

          <div class="tiles-grid tiles-grid--report">
            <button
              type="button"
              class="tile"
              *ngFor="let item of reportesVisibles(section, grupo.clave)"
              (click)="openDialog(item)"
              [title]="item.titleKey ? (item.titleKey | tenantText) : item.title"
            >
              <mat-icon class="tile__icon">{{ item.icon }}</mat-icon>
              <span class="tile__label">{{ item.labelKey ? (item.labelKey | tenantText) : item.label }}</span>
            </button>
          </div>
        </div>
        </ng-container>
      </ng-container>

      <ng-template #opcionesSinAgrupar>
        <div class="tiles-grid"
             [class.tiles-grid--accent]="section.title === 'Operaciones'">
          <button
            type="button"
            class="tile"
            *ngFor="let item of itemsVisibles(section)"
            (click)="openDialog(item)"
            [title]="item.titleKey ? (item.titleKey | tenantText) : item.title"
          >
            <mat-icon class="tile__icon">{{ item.icon }}</mat-icon>
            <span class="tile__label">{{ item.labelKey ? (item.labelKey | tenantText) : item.label }}</span>
          </button>
        </div>
      </ng-template>
    </div>

  </div>
</div>

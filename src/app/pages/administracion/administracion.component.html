<div class="admin-page">
  <div class="admin-page__inner">

    <header class="admin-page__header">
      <div class="admin-page__header-accent"></div>
      <div>
        <h1 class="admin-page__title">{{ 'administration' | tenantText }}</h1>
        <p class="admin-page__subtitle">
          {{ (mostrarAlmacen ? 'adminSubtitle' : 'adminSubtitleSalesOnly') | tenantText }}
        </p>
      </div>
    </header>

    <section class="admin-page__columns">
      <article class="admin-card">
        <h2 class="admin-card__title">{{ 'sales' | tenantText }}</h2>
        <p class="admin-card__subtitle">
          {{ 'salesCardSubtitle' | tenantText }}
        </p>
        <app-menu-ventas></app-menu-ventas>
      </article>

      <article class="admin-card" *ngIf="mostrarAlmacen">
        <h2 class="admin-card__title">{{ 'warehouse' | tenantText }}</h2>
        <p class="admin-card__subtitle">
          {{ 'warehouseCardSubtitle' | tenantText }}
        </p>
        <app-menu-almacen></app-menu-almacen>
      </article>
    </section>

  </div>
</div>

<div class="report report-panel">

  <ngx-spinner
    bdColor="rgba(0, 0, 0, 0.35)"
    size="medium"
    color="#fff"
    type="ball-scale-multiple"
    name="canalVentaSpinner"
    class="report-panel__spinner"
  >
    <p>Cargando canales...</p>
  </ngx-spinner>

  <header class="report-panel__header">
    <div>
      <h3 class="report-panel__title">Ventas por canal</h3>
      <p class="report-panel__subtitle">
        Espacio · Llevar · Delivery
      </p>
    </div>
  </header>

  <section class="report-panel__summary-group">
    <div class="report-panel__summary-chip">
      Espacio: S/. {{ totalVentaEspacio }}
    </div>
    <div class="report-panel__summary-chip">
      Llevar: S/. {{ totalVentaLlevar }}
    </div>
    <div class="report-panel__summary-chip">
      Delivery: S/. {{ totalVentaDelivery }}
    </div>
  </section>

  <div class="report-panel__chart-container">
    <div
      #chart
      class="report-panel__chart"
      id="chart-ventas-diarias"
    ></div>
  </div>
</div>

<div class="report report-panel">

  <ngx-spinner
    bdColor="rgba(0, 0, 0, 0.35)"
    size="medium"
    color="#fff"
    type="ball-scale-multiple"
    name="popularidadPlatoSpinner"
    class="report-panel__spinner"
  >
    <p>{{ 'loadingPopularity' | tenantText }}</p>
  </ngx-spinner>

  <header class="report-panel__header">
    <div>
      <span class="report-panel__eyebrow">Demanda</span>
      <h3 class="report-panel__title">{{ 'dishPopularity' | tenantText }}</h3>
      <p class="report-panel__subtitle">
        {{ 'topBestSellingDishes' | tenantText }}
      </p>
    </div>

    <label class="report-panel__control">
      <span>{{ 'top' | tenantText }}</span>
      <select
        class="report-panel__select"
        (change)="onReportTypeChange($event)"
      >
        <option value="5">{{ 'top' | tenantText }} 5</option>
        <option value="10">{{ 'top' | tenantText }} 10</option>
        <option value="15">{{ 'top' | tenantText }} 15</option>
        <option value="20">{{ 'top' | tenantText }} 20</option>
      </select>
    </label>
  </header>

  <section class="report-panel__summary-group" *ngIf="!sinDatos">
    <div class="report-panel__summary-chip">Líder: {{ productoLider }}</div>
    <div class="report-panel__summary-chip">Unidades del top: {{ totalUnidades }}</div>
  </section>

  <div class="report-panel__chart-container">
    <div
      #chart
      class="report-panel__chart"
      id="chart-ventas-diarias"
    ></div>

    <div class="report-panel__empty" *ngIf="sinDatos">
      {{ 'noDataForRange' | tenantText }}
    </div>
  </div>
</div>

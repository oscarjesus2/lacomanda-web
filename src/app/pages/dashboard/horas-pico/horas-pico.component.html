<div class="report report-panel">

  <ngx-spinner
    bdColor="rgba(0, 0, 0, 0.35)"
    size="medium"
    color="#fff"
    type="ball-scale-multiple"
    name="horasPicoSpinner"
    class="report-panel__spinner"
  >
    <p>{{ 'loadingPeakHours' | tenantText }}</p>
  </ngx-spinner>

  <header class="report-panel__header">
    <div>
      <h3 class="report-panel__title">{{ 'peakHours' | tenantText }}</h3>
      <p class="report-panel__subtitle">
        {{ 'daySegments' | tenantText }}
      </p>
    </div>

    <label class="report-panel__control">
      <span>{{ 'timeSlot' | tenantText }}</span>
      <select
        class="report-panel__select"
        (change)="onReportTypeChange($event)"
      >
        <option value="1">{{ 'afternoon' | tenantText }}</option>
        <option value="2">{{ 'night' | tenantText }}</option>
        <option value="3">{{ 'lateNight' | tenantText }}</option>
      </select>
    </label>
  </header>

  <section class="report-panel__summary" *ngIf="horaPico">
    <span class="report-panel__summary-label">{{ 'peakHour' | tenantText }}</span>
    <span class="report-panel__summary-value">
      {{ horaPico }}
    </span>
  </section>

  <div class="report-panel__chart-container">
    <div
      #chart
      class="report-panel__chart"
      id="chart-ventas-diarias"
    ></div>

    <div class="report-panel__empty" *ngIf="sinDatos">
      {{ 'noDataForRange' | tenantText }}
    </div>
  </div>
</div>

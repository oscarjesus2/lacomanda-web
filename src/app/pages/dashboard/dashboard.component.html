<div class="dashboard">
<div class="dashboard__inner">

  <!-- TÍTULO DE PÁGINA -->
  <header class="dashboard__header">
    <div class="dashboard__header-accent"></div>
    <div>
      <h1 class="dashboard__title">Dashboard de reportes</h1>
      <p class="dashboard__subtitle">Analiza ventas, popularidad de platos y rendimiento por rango de fechas.</p>
    </div>
  </header>

  <!-- BARRA DE FILTROS -->
  <section class="dashboard__filters">

    <div class="dashboard__controls">

      <div class="dashboard__field">
        <label for="fecha-inicial" class="dashboard__label">Fecha inicial</label>
        <input
          type="date"
          id="fecha-inicial"
          [(ngModel)]="fechaInicial"
          (change)="onFechaInicialChange()"
          [min]="minFechaFinal"
          class="dashboard__input"
        />
      </div>

      <div class="dashboard__field">
        <label for="fecha-final" class="dashboard__label">Fecha final</label>
        <input
          type="date"
          id="fecha-final"
          [(ngModel)]="fechaFinal"
          [min]="minFechaFinal"
          [max]="maxFechaFinal"
          (change)="onFechaFinalChange()"
          class="dashboard__input"
        />
      </div>

    </div>

    <!-- TOGGLES DE REPORTES -->
    <div class="dashboard__toggles">
      <label class="dash-toggle" *ngFor="let rep of reportes">
        <input
          type="checkbox"
          [(ngModel)]="rep.visible"
          (change)="updateVisibleReportes()"
        />
        <span class="dash-toggle__slider"></span>
        <span class="dash-toggle__label">{{ rep.titulo }}</span>
      </label>
    </div>

  </section>

  <!-- GRID DE REPORTES -->
  <main class="dashboard__grid">
    <article
      class="dashboard-card"
      *ngFor="let rep of visibleReportes"
    >
      <div class="dashboard-card__chart">
        <ng-container [ngSwitch]="rep.componente">

          <app-ventas-diarias
            *ngSwitchCase="'ventas-diarias'"
            [fechaInicial]="fechaInicial"
            [fechaFinal]="fechaFinal">
          </app-ventas-diarias>

          <app-popularidad-platos
            *ngSwitchCase="'popularidad-platos'"
            [fechaInicial]="fechaInicial"
            [fechaFinal]="fechaFinal">
          </app-popularidad-platos>

          <app-horas-pico
            *ngSwitchCase="'horas-pico'"
            [fechaInicial]="fechaInicial"
            [fechaFinal]="fechaFinal">
          </app-horas-pico>

          <app-canal-venta
            *ngSwitchCase="'canal-venta'"
            [fechaInicial]="fechaInicial"
            [fechaFinal]="fechaFinal">
          </app-canal-venta>

          <app-anulaciones
            *ngSwitchCase="'anulaciones'"
            [fechaInicial]="fechaInicial"
            [fechaFinal]="fechaFinal">
          </app-anulaciones>

        </ng-container>
      </div>
    </article>
  </main>
  
</div>
  <footer class="dashboard__footer">
    <p>© 2024 LaComanda · Dashboard de Restaurantes.</p>
  </footer>
</div>

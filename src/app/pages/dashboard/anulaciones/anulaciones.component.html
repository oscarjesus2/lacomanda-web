<div class="report report-panel">

  <ngx-spinner
    bdColor="rgba(0, 0, 0, 0.35)"
    size="medium"
    color="#fff"
    type="ball-scale-multiple"
    name="anulacionesSpinner"
    class="report-panel__spinner"
  >
    <p>Cargando anulaciones...</p>
  </ngx-spinner>

  <header class="report-panel__header">
    <div>
      <h3 class="report-panel__title">Anulaciones</h3>
      <p class="report-panel__subtitle">
        Por producto y motivo
      </p>
    </div>
  </header>

  <div class="report-panel__chart-container">
    <div class="report-panel__chart chart" #chart></div>

    <div class="report-panel__empty" *ngIf="sinDatos">
      Sin datos para el rango seleccionado.
    </div>
  </div>

  <h4 class="report-panel__table-title">
    {{ selectedProducto }}
  </h4>

  <div class="report-panel__table-wrapper">
    <table class="data-table">
      <thead>
        <tr>
          <th>Motivo</th>
          <th>Documento</th>
          <th>Cantidad</th>
          <th>Precio</th>
          <th>Autoriza</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of filteredData">
          <td>{{ item.Motivo }}</td>
          <td>{{ item.Documento }}</td>
          <td>{{ item.Cantidad }}</td>
          <td>{{ item.Precio }}</td>
          <td>{{ item.Autoriza }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div
  *ngIf="headerVisible || operationalHeaderOpen"
  class="header-shell"
  [class.header-shell--operational]="!headerVisible && operationalHeaderOpen">
  <app-header></app-header>
</div>

<button
  *ngIf="canRevealOperationalHeader"
  type="button"
  class="operational-header-handle"
  [class.operational-header-handle--open]="operationalHeaderOpen"
  [attr.aria-expanded]="operationalHeaderOpen"
  [attr.aria-label]="(operationalHeaderOpen
    ? 'hideNavigationHeader'
    : 'showNavigationHeader') | tenantText"
  [matTooltip]="(operationalHeaderOpen
    ? 'hideNavigationHeader'
    : 'showNavigationHeader') | tenantText"
  (click)="toggleOperationalHeader()">
  <mat-icon>{{ operationalHeaderOpen ? 'keyboard_arrow_up' : 'keyboard_arrow_down' }}</mat-icon>
</button>

<button
  *ngIf="operationalHeaderOpen"
  type="button"
  class="operational-header-backdrop"
  [attr.aria-label]="'hideNavigationHeader' | tenantText"
  (click)="closeOperationalHeader()">
</button>

<!-- Banner global: backend inalcanzable -->
<div *ngIf="backendDown$ | async" class="backend-offline-banner">
  <span class="backend-offline-banner__icon">⚠</span>
  <span class="backend-offline-banner__text">
    {{ 'serverOffline' | tenantText }} —
    {{ 'operationsUnavailable' | tenantText }}
  </span>
</div>

<!-- Aviso: impresion directa no disponible. Avisa, no bloquea la venta. -->
<div *ngIf="isOperationalRoute && avisoImpresion" class="print-warning-banner">
  <mat-icon class="print-warning-banner__icon" aria-hidden="true">print_disabled</mat-icon>
  <span class="print-warning-banner__text">{{ avisoImpresion }}</span>
  <a class="print-warning-banner__action" routerLink="/qz-tray-required">Configurar</a>
  <button
    type="button"
    class="print-warning-banner__close"
    aria-label="Ocultar aviso de impresión"
    (click)="cerrarAvisoImpresion()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<router-outlet></router-outlet>
<app-asistente-estacion></app-asistente-estacion>
